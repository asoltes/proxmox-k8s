apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-poc-webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/asoltes/proxmox-k8s.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-poc-webapp
  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
